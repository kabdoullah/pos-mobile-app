# Icône « Caisse et reçu » (canevas de design R2-Icone) : dessin crème sur fond
# cacao, grille adaptative 108 × 108 dp, dessin inscrit dans le cercle de 66 dp.
flutter_launcher_icons:
  # iOS — fond opaque obligatoire (pas de transparence acceptée par App Store)
  ios: true
  image_path_ios: assets/launcher_icons/icon_ios.png
  remove_alpha_ios: true

  # Android — icône adaptative (premier plan + fond uni)
  android: true
  min_sdk_android: 21
  # Repli pour Android < API 26 (icône non adaptative)
  image_path_android: assets/launcher_icons/icon_android_legacy.png
  # Le premier plan est déjà dessiné sur la grille 108 dp : pas de marge ajoutée
  adaptive_icon_foreground: assets/launcher_icons/icon_android_fg.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#9A5527"
  # Icône à thème (Android 13+) : silhouette seule, teintée par le système
  adaptive_icon_monochrome: assets/launcher_icons/icon_android_monochrome.png

  # Web désactivé — app mobile uniquement
  web:
    generate: false
