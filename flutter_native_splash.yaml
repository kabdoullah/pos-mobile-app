# Écran de démarrage : le dessin de l'icône « Caisse et reçu » centré sur le
# fond cacao (couleur de fond de l'icône), identique en thème clair et sombre.
flutter_native_splash:
  color: "#9A5527"

  # Dessin crème sur fond transparent — la couleur ci-dessus remplit l'écran
  image: assets/images/logo_splash.png

  # Plein écran (cache la barre de statut pendant le splash)
  fullscreen: true

  android: true
  ios: true
  web: false

  android_12:
    # Android 12+ : le dessin tient dans le cercle visible (2/3 de l'image)
    color: "#9A5527"
    image: assets/images/logo_splash.png
    icon_background_color: "#9A5527"
