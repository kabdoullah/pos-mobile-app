# Hooks pre-commit pour garantir qualité du code avant chaque commit.
# Installation : `pip install pre-commit && pre-commit install`
# Run manuel : `pre-commit run --all-files`

# Fichiers générés (build_runner) et texte de licence tiers : jamais retouchés
# à la main, une régénération annulerait toute correction.
exclude: '(\.g\.dart|\.freezed\.dart)$|^assets/fonts/'

repos:
  # Hooks de base (whitespace, fin de fichiers, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: detect-private-key

  # Vérification basique des messages de commit (Conventional Commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, perf, build, ci, revert]
